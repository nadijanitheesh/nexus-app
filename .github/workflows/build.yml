name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install --user --upgrade Cython==0.29.36 buildozer

    - name: Initialize Buildozer Config
      run: |
        # Check if buildozer.spec exists, if not init
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
        fi

    - name: Run Buildozer Build
      run: |
        buildozer android debug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus-apk
        path: bin/*.apk
        
